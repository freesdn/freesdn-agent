name: CI

# Public CI for github.com/freesdn/freesdn-agent.
#
# This repo shipped signed binaries for Windows, Linux and macOS and had no CI:
# agent-release.yml fires on a v* tag and builds them, so a pull request opened
# here was gated by nothing at all. The tests existed and ran, but only in the
# private monorepo, which nobody sending a PR to this repo can see.
#
# Everything below mirrors the monorepo's agent-test job. Where it differs, the
# difference is deliberate and commented.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # The binaries are built once and installed for months. A dependency CVE
  # disclosed after release needs to surface without anyone pushing.
  schedule:
    - cron: '0 6 * * 1'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          # 3.12 to match packaging/: PyInstaller builds the released binaries
          # on 3.12, so that is the interpreter worth proving green.
          python-version: '3.12'

      - name: Install build deps (netifaces is a C extension)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends build-essential

      - name: Install the agent (daemon + dev extras)
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[daemon,dev]'
          # pytest-qt is removed rather than skipped: importing it pulls in
          # PySide6, which needs Qt system libraries a slim runner does not
          # have. The GUI is out of scope here; the daemon, CLI, updater and
          # scanner paths are what this guards.
          pip uninstall -y pytest-qt

      - name: Ruff lint
        # tests/ as well as src/. Excluded once, and 58 findings had accrued --
        # one of them a test that declared its expected values and never
        # asserted against them.
        run: ruff check src/ tests/

      - name: Tests
        run: python -m pytest -q

      - name: The CLI runs
        # Cheap, and it catches what a unit test cannot: an entry point that
        # imports something the package does not declare. The released artifact
        # is a binary of exactly this.
        run: |
          python -m freesdn_agent.daemon.cli --version
          python -m freesdn_agent.daemon.cli --help > /dev/null

  dependencies:
    name: Dependency lockstep and audit
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12'

      # Three files pin this agent's dependencies and all three have to agree.
      # pyasn1 -- a pin added to close three high advisories -- was present in
      # pyproject.toml and absent from requirements.txt for a while, which a
      # version-comparison check cannot see.
      - name: Check dependency lockstep (pyproject / requirements*.txt)
        run: |
          python - <<'PY'
          import re, sys, tomllib
          pj = tomllib.load(open("pyproject.toml", "rb"))
          pins = {}
          for dep in pj["project"]["dependencies"] + pj["project"]["optional-dependencies"]["daemon"]:
              m = re.match(r"^([A-Za-z0-9._-]+)==([^\s;]+)", dep)
              if m:
                  name = m.group(1).lower().replace("_", "-")
                  if name in pins and pins[name] != m.group(2):
                      sys.exit(f"pyproject disagrees with itself on {name}: {pins[name]} vs {m.group(2)}")
                  pins[name] = m.group(2)
          req = {}
          for line in open("requirements.txt", encoding="utf-8"):
              m = re.match(r"^([A-Za-z0-9._-]+)==([^\s;#]+)", line.strip())
              if m:
                  req[m.group(1).lower().replace("_", "-")] = m.group(2)
          bad = [f"  {n}: pyproject={v} requirements.txt={req[n]}"
                 for n, v in pins.items() if n in req and req[n] != v]
          if bad:
              sys.exit("Pin mismatch between pyproject.toml and requirements.txt:\n" + "\n".join(bad))
          # A version mismatch is not the only failure mode. A pin present in
          # pyproject and ABSENT from requirements.txt is invisible to the check
          # above, and that is exactly how pyasn1 (a security pin added to close
          # three high advisories) was left out of requirements.txt on 2026-08-15.
          missing = sorted(n for n in pins if n not in req)
          if missing:
              sys.exit(
                  "Pinned in pyproject.toml but MISSING from requirements.txt: "
                  + ", ".join(missing)
                  + "\nThe three agent dependency files must stay in lockstep."
              )
          print(f"OK: {len(pins)} pyproject pins present and consistent in requirements.txt")

          # requirements-release.txt is the hash-locked file the binaries are
          # built from, so a security pin missing THERE ships vulnerable.
          rel = {}
          for line in open("requirements-release.txt", encoding="utf-8"):
              # Lines look like: aiohttp==3.14.3 \   (hashes follow on later lines)
              m = re.match(r"^([A-Za-z0-9._-]+)==([^\s;]+)", line.strip())
              if m:
                  rel[m.group(1).lower().replace("_", "-")] = m.group(2)
          drift = [f"  {n}: pyproject={v} requirements-release.txt={rel.get(n, 'ABSENT')}"
                   for n, v in pins.items() if rel.get(n) != v]
          if drift:
              sys.exit(
                  "requirements-release.txt is out of lockstep. Regenerate it:\n"
                  "  uv pip compile pyproject.toml --extra build --universal "
                  "--generate-hashes --no-annotate -o requirements-release.txt\n"
                  + "\n".join(drift)
              )
          print(f"OK: {len(pins)} pins consistent in requirements-release.txt")
          PY

      - name: Install build deps
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends build-essential

      - name: Install
        run: |
          python -m pip install --upgrade pip pip-audit
          pip install -e '.[daemon]'

      # Blocking. This repo ships binaries that people install and forget, so a
      # known-vulnerable dependency here is somebody's exposed machine, not a
      # backlog item. --strict is omitted for one reason: freesdn-agent itself
      # is not on PyPI, so it can never be audited, and --strict would make the
      # job permanently red -- which teaches everyone to ignore it.
      - name: pip-audit
        run: pip-audit
